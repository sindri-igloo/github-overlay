name: Lint commit messages and PR title
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5

  # The PR title becomes the merge commit's subject, so it follows the same
  # rules as the commits.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx --yes @commitlint/cli@19 --config .commitlintrc.js
